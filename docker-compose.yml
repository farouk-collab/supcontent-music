services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: supcontent-api
    restart: always
    environment:
      NODE_ENV: development
      PORT: 1234
      DATABASE_URL: postgres://supcontent:supcontent@db:5432/supcontent
      REDIS_URL: redis://redis:6379
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:1234/auth/oauth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:1234/auth/oauth/github/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-supcontent-local-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-supcontent-local-refresh-secret-change-me}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-SupContent Music <no-reply@supcontent.local>}
    depends_on:
      - db
      - redis
    ports:
      - "1234:1234"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: supcontent-web
    restart: always
    depends_on:
      - api
    ports:
      - "4173:80"

  db:
    image: postgres:15
    container_name: supcontent-db
    restart: always
    environment:
      POSTGRES_USER: supcontent
      POSTGRES_PASSWORD: supcontent
      POSTGRES_DB: supcontent
    ports:
      - "5432:5432"
    volumes:
      - supcontent_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: supcontent-redis
    restart: always
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4
    container_name: supcontent-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  supcontent_pgdata:
