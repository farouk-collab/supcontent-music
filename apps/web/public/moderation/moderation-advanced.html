<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Modération - SUPCONTENT Admin</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo-supconnect.svg" />
  <link rel="stylesheet" href="/noyau/styles.css" />
  <style>
    body { min-height:100vh; background:linear-gradient(180deg,#050505,#0d0d0d); color:#fff; }
    .shell { width:min(1100px,calc(100vw - 24px)); margin:0 auto; padding:28px 0 120px; }
    .page-header { margin-bottom:24px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:24px; padding:24px; }
    .back-link { display:inline-flex; align-items:center; gap:6px; color:#a1a1aa; text-decoration:none; font-size:14px; font-weight:600; margin-bottom:12px; }
    .back-link:hover { color:#fff; }
    .eyebrow { color:var(--accent); font-size:12px; letter-spacing:.24em; text-transform:uppercase; font-weight:800; margin:0; }
    .page-title { font-size:32px; margin:8px 0 0; letter-spacing:-.03em; }
    .tabs { display:flex; gap:8px; margin-bottom:20px; }
    .tab-btn { padding:10px 20px; border-radius:999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); color:#d4d4d8; font:inherit; cursor:pointer; font-weight:700; font-size:14px; }
    .tab-btn.is-active { background:var(--accent2); border-color:var(--accent2); color:#04130d; }
    .tab-panel { display:none; }
    .tab-panel.is-active { display:block; }
    .card { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:20px; padding:20px; margin-bottom:14px; }
    .card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .meta { font-size:13px; color:#a1a1aa; }
    .rating { color:#f5c842; font-size:16px; }
    .body-text { color:#e5e7eb; font-size:14px; line-height:1.6; margin:8px 0; }
    .tag { display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.06); }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .btn { padding:8px 16px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.08); color:#e5e7eb; font:inherit; cursor:pointer; font-size:13px; font-weight:700; }
    .btn-danger { background:rgba(239,68,68,.18); border-color:rgba(239,68,68,.3); color:#fca5a5; }
    .btn-primary { background:var(--accent2); border-color:var(--accent2); color:#04130d; }
    .btn-warn { background:rgba(245,200,66,.15); border-color:rgba(245,200,66,.3); color:#fde68a; }
    .search-row { display:flex; gap:8px; margin-bottom:16px; }
    .search-input { flex:1; border:1px solid rgba(255,255,255,.1); border-radius:12px; background:rgba(0,0,0,.2); color:#fff; padding:10px 14px; font:inherit; outline:0; }
    .user-role { font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; }
    .role-admin { background:rgba(239,68,68,.2); color:#fca5a5; border:1px solid rgba(239,68,68,.3); }
    .role-user { background:rgba(63,131,255,.15); color:#93c5fd; border:1px solid rgba(63,131,255,.25); }
    .role-banned { background:rgba(113,113,122,.2); color:#a1a1aa; border:1px solid rgba(113,113,122,.3); }
    .empty { color:#71717a; text-align:center; padding:40px 0; }
    .toast { position:fixed; bottom:24px; right:24px; background:#fff; color:#000; padding:12px 20px; border-radius:12px; font-weight:700; font-size:14px; display:none; z-index:9999; }
    .featured-badge { background:rgba(245,200,66,.2); border:1px solid rgba(245,200,66,.4); color:#fde68a; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; }
    #adminCheck { padding:20px; color:#fca5a5; font-weight:700; display:none; }
  </style>
</head>
<body>
  <div class="shell">
    <div id="adminCheck">Accès réservé aux administrateurs.</div>

    <header class="page-header" id="pageHeader" style="display:none">
      <a class="back-link" href="/accueil/accueil.html">← Retour</a>
      <p class="eyebrow">Administration</p>
      <h1 class="page-title">Panneau de modération</h1>
    </header>

    <div id="mainContent" style="display:none">
      <div class="tabs">
        <button class="tab-btn is-active" data-tab="reports">Signalements</button>
        <button class="tab-btn" data-tab="users">Utilisateurs</button>
      </div>

      <!-- Signalements -->
      <div class="tab-panel is-active" id="tab-reports">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <span style="color:#a1a1aa;font-size:14px">Critiques signalées en attente de modération</span>
          <button class="btn" id="refreshReports">Actualiser</button>
        </div>
        <div id="reportsList"><div class="empty">Chargement…</div></div>
      </div>

      <!-- Utilisateurs -->
      <div class="tab-panel" id="tab-users">
        <div class="search-row">
          <input class="search-input" id="userSearch" placeholder="Rechercher par nom, pseudo ou email…" />
          <button class="btn btn-primary" id="searchUsersBtn">Rechercher</button>
        </div>
        <div id="usersList"><div class="empty">Lancez une recherche ou chargez tous les utilisateurs.</div></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script type="module" src="/moderation/moderation-advanced.js"></script>
  <script type="module" src="/noyau/footer.js"></script>
</body>
</html>
